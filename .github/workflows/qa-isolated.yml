name: Isolated Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-browser/**'
      - '.github/workflows/qa-isolated.yml'
      - 'src/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-isolated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated_browser:
    # QA environment is deliberately provisioned for PR #6 only, without hosted secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: 'true'
      QA_CONFIRM_DISPOSABLE_STACK: 'yes'
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_PUBLIC_TENANT_SLUG: corsys-catalogo-demo
      VITE_GOOGLE_ROUTES_UI_ENABLED: 'false'
      QA_BASE_URL: http://127.0.0.1:3000
      QA_SUPABASE_URL: http://127.0.0.1:54321
      QA_B2B_PENDING_EMAIL: qa-b2b-pending@qa.invalid
      QA_B2B_PENDING_PASSWORD: QA-Disposable-Only-2026!
      QA_B2B_SUSPENDED_EMAIL: qa-b2b-suspended@qa.invalid
      QA_B2B_SUSPENDED_PASSWORD: QA-Disposable-Only-2026!
      QA_B2B_REJECTED_EMAIL: qa-b2b-rejected@qa.invalid
      QA_B2B_REJECTED_PASSWORD: QA-Disposable-Only-2026!
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked packages
        run: bun install --frozen-lockfile

      - name: Install local Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Replace catalog bootstrap with synthetic QA-only data
        run: python3 scripts/qa-browser/prepare_isolated_stack.py

      - name: Enable checkout only in ephemeral local Edge Functions
        shell: bash
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}" && test -z "${SUPABASE_PROJECT_ID:-}"
          install -m 600 /dev/null supabase/functions/.env
          printf '%s\n' 'CHECKOUT_ENABLED=true' 'PUBLIC_SUPABASE_URL=http://127.0.0.1:54321' > supabase/functions/.env

      - name: Start disposable local Supabase with loopback bindings
        shell: bash
        run: |
          docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 corsys-isolated-qa
          supabase start --network-id corsys-isolated-qa --exclude studio,mail,analytics

      - name: Create synthetic users and expose only local public key to frontend
        shell: bash
        run: |
          supabase status -o env > "$RUNNER_TEMP/local-supabase.env"
          source "$RUNNER_TEMP/local-supabase.env"
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          QA_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" QA_SUPABASE_URL="http://127.0.0.1:54321" bun scripts/qa-browser/seed_isolated_stack.mjs
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install browser for local-only E2E
        run: |
          python3 -m pip install 'playwright>=1.48,<2'
          python3 -m playwright install --with-deps chromium

      - name: Start local storefront
        shell: bash
        run: |
          (bun run dev -- --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/vite-qa.log" 2>&1 &)
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          echo 'Isolated QA frontend failed to start'
          exit 1

      - name: Verify B2B unauthorized statuses in real Chromium + local Auth
        run: python3 scripts/qa-browser/test_b2b_access_browser.py

      - name: Verify PF/PJ checkout transitions in real Chromium
        run: python3 scripts/qa-browser/test_retail_identity_browser.py

      - name: Verify configured checkout fields in real Chromium
        run: python3 scripts/qa-browser/test_checkout_field_policy_browser.py

      - name: Verify wholesale status, buyer and empty-catalog session races in Chromium
        run: python3 scripts/qa-browser/test_wholesale_session_races_browser.py

      - name: Check monetary wholesale minimum in Chromium without creating an order
        run: python3 scripts/qa-browser/test_wholesale_ui_minimum_browser.py

      - name: Verify one fictitious local checkout, WhatsApp popup close and replay guard
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: python3 scripts/qa-browser/test_checkout_transaction_browser.py

      - name: Independently assert persisted fictitious order count in local Postgres
        shell: bash
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: bash scripts/qa-browser/assert_local_order.sh

      - name: Verify approved wholesale buyer checkout and tracking in Chromium
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: python3 scripts/qa-browser/test_wholesale_transaction_browser.py

      - name: Independently assert retail and wholesale buyer data in isolated Postgres
        shell: bash
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: bash scripts/qa-browser/assert_local_wholesale_order.sh

      - name: Diagnose optional private order PDF in disposable storage
        shell: bash
        run: bash scripts/qa-browser/diagnose_local_order_pdf.sh

      - name: Verify logout during in-flight checkout in Chromium
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: python3 scripts/qa-browser/test_checkout_session_race_browser.py

      - name: Audit additional race-created B2B order in disposable Postgres
        shell: bash
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: bash scripts/qa-browser/assert_local_checkout_race.sh

      - name: Verify cross-tenant and revoked wholesale buyer in local Auth and Edge
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: python3 scripts/qa-browser/test_revoked_wholesale_buyer_api.py

      - name: Persist one fictitious PF retail order and validate tracking in Chromium
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: python3 scripts/qa-browser/test_pf_checkout_browser.py

      - name: Audit final PF snapshot and four synthetic orders in local Postgres
        shell: bash
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: bash scripts/qa-browser/assert_local_pf_order.sh

      - name: Exercise rollback of one disposable delivery setting only
        shell: bash
        run: bash scripts/qa-browser/drill_local_settings_rollback.sh

      - name: Rehearse isolated logical PostgreSQL backup and restore
        shell: bash
        env:
          QA_ALLOW_SYNTHETIC_LOCAL_ORDER: 'yes'
        run: bash scripts/qa-browser/drill_local_backup_restore.sh

      - name: Stop ephemeral database
        if: always()
        run: supabase stop --no-backup || true
